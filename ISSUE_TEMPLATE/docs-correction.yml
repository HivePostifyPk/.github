name: Documentation correction
description: Something in the docs is wrong, unclear or missing
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      placeholder: docs/fees-and-payments.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What should it say instead?
  - type: markdown
    attributes:
      value: Please do not include passwords, wallet keys or private payment details.
